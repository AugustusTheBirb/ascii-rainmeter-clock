; ASCII digit clock -- 24h HH:MM
;
; Layout model
; ------------
; Every digit image is a #DigitW# x #DigitH# cell. The advance from one digit
; to the next is:
;
;     Tracking + DigitW - Trim(previous digit) - Trim(current digit)
;
; Trim() is the per-glyph side-bearing correction, in cell pixels, taken off
; EACH side of a glyph. With #TrimOne# = 0 the whole thing collapses to plain
; monospace, which is the shipped default.
;
; The font is circle-based, so every glyph genuinely fills its cell and wants
; Trim = 0. The original "1" was the one exception -- a bare vertical line,
; 14px of ink in an 80px cell -- which is what the trim machinery was built
; for. It has since been replaced by a wider glyph, in line with the rest of
; the set, so the trim is no longer needed and stays at 0.
;
; The machinery is left wired up in case another outlier glyph turns up: raise
; #TrimOne# and the block re-centres itself inside the fixed canvas. Trimming
; makes neighbouring cells overlap, which is only safe because the digit PNGs
; have transparent backgrounds.
;
; Minute sweep
; ------------
; A digit that is about to change does not snap to its next value. It
; dissolves into it over the last #MorphSecs# seconds of the minute, one cell
; at a time, left-to-right and bottom-up -- every position that changes, all
; together, so 00:39 -> 00:40 sweeps the 3 and the 9 at once. Frames are
; pre-rendered by morph.py into #ImgDir#\morph\<cell>\<old>_<new>\<frame>.png;
; digits that are not changing read <d>_<d>\0.png, which is the plain digit.
;
; The 60 frames are traversed in #MorphSecs# steps rather than one frame per
; second. Spreading them over the whole minute reads as stalled: most cells of
; a glyph are blank, so a great many single-frame steps change nothing visible
; and the dissolve looks stuck between the ones that do. Compressing it into a
; short window puts several cells' worth of change in every step.
;
; Frame 0 is the pure current digit and frame 59 the pure next one, so :59 to
; :00 draws the same image twice and never jumps. That also means #Morph# = 0
; can disable the effect just by pinning the frame to 0, with no second image
; path to maintain -- as does the whole pre-sweep part of every minute.
;
; Date line
; ---------
; Fine-print scale: real monospace text rather than an ASCII-art mosaic, which
; stays legible at a size where mosaic glyphs would not. It hangs below the
; canvas, and because Rainmeter positions a skin by its top-left corner the
; window only grows downward -- the digits keep their place over the
; wallpaper's centre. #TextColor# is rewritten by palette.py to the brightest
; colour of whichever preset is applied.
;
; Not set here
; ------------
; Window position and Draggable are per-skin settings Rainmeter stores in
; %APPDATA%\Rainmeter\Rainmeter.ini, not in this file. Currently pinned at
; WindowX=643 WindowY=474 (logical px, = screen centre at 175% scaling) with
; Draggable=0.
;
; Debug mode
; ----------
; Set #Debug# to 1 (or middle-click the skin) to run simulated time at
; #DebugSecPerMin# real seconds per simulated minute, so every digit
; combination cycles past quickly and kerning can be judged. #DebugStartMin#
; picks the starting point, as minutes since midnight. In this mode the sweep
; runs across the whole simulated minute rather than #MorphSecs# of it, so
; #DebugSecPerMin# also sets how many sweep steps you get to see.

[Rainmeter]
; Tick interval, ms. The sweep steps once per tick, so this is what stops it
; moving in large jumps. MUST stay consistent with #MorphTPS# below --
; skin.write_update_ms() writes both together, and the GUI only offers rates
; that divide 1000 exactly.
Update=125
DynamicWindowSize=1
AccurateText=1
MiddleMouseUpAction=[!SetVariable Debug "(1-#Debug#)"][!SetVariable TickZero "[mTick]"][!UpdateMeasure mMinutes][!Redraw]

[Metadata]
Name=ASCII Clock
Information=24h HH:MM clock rendered from ASCII-art digit images.
Version=0.3

[Variables]
; Source of the digit PNGs, built by extract_digits.py.
ImgDir=#@#digits

DigitW=80
DigitH=80

; Uniform scale applied to every cell and every offset.
Scale=1

; Constant space between adjacent digit cells.
Tracking=0

; Stand-in for the missing colon glyph: blank space between HH and MM.
SepWidth=40

; Per-side bearing clawed back from the digit "1". 0 = pure monospace.
TrimOne=0

; Fixed canvas: the full monospace width. The digit block is centred inside
; it, so the skin window never changes size as the time changes and never
; drifts off centre no matter what #TrimOne# is set to.
CanvasW=((4*#DigitW#)+(3*#Tracking#)+#SepWidth#)
CanvasH=#DigitH#

; --- sweep -----------------------------------------------------------------
; Each changing digit dissolves into its next value over the minute instead of
; snapping, one cell at a time, left-to-right and bottom-up.
; Morph=0 falls back to a hard change -- frame 0 of any transition is just the
; pure current digit, so no separate image path is needed to switch it off.
Morph=1
; Cell size of one sweep step. The glyphs sit on a 4px character grid, so 4
; moves exactly one character per step (~6.7/sec, a smooth dissolve) and 8
; moves a 2x2 block (~1.7/sec, more deliberate). Both land on real character
; boundaries. Frames exist for both; this only picks which set is read.
MorphCell=8
; How many seconds before the minute rolls over the dissolve starts. All 60
; frames are traversed within it, so a smaller number means bigger steps: at 10
; each step advances ~6 frames, which at MorphCell=8 is ~10 cells of visible
; change. 60 restores the old one-frame-per-second crawl. Minimum 2 -- the
; formula divides by #MorphSecs#-1.
MorphSecs=6
; Skin ticks per second: 1000 / [Rainmeter]Update, and the two must agree or
; the sweep finishes early or late. The sweep gets #MorphSecs# x #MorphTPS#
; steps, so 10 x 5 = 50 steps -- against ~72 changed cells at MorphCell=8 that
; is about 1.5 cells a step. Keep the step count at or below the smallest
; changed-cell count (59 at 8px, 160 at 4px) or some steps land on no change.
MorphTPS=8

; --- date ------------------------------------------------------------------
; Fine-print scale: real monospace text, not ASCII-art glyphs. Written by
; palette.py to the brightest colour of whichever preset is applied.
TextColor=200,197,255
DateSize=12
; Vertical space between the bottom of the digits and the date line.
DateGap=14

; --- debug -----------------------------------------------------------------
Debug=0
DebugSecPerMin=5
DebugStartMin=0
; Tick value at which the debug ramp starts counting. Left at 0 in the file so
; a refresh begins exactly at #DebugStartMin#; the middle-click toggle snaps it
; to "now" so mid-session toggling also starts at #DebugStartMin#.
TickZero=0

; ---------------------------------------------------------------- measures --

; Real clock, as plain integers. %#H / %#M strip the leading zero so the
; values never look octal to the formula parser.
[mRealH]
Measure=Time
Format=%#H

[mRealM]
Measure=Time
Format=%#M

[mRealS]
Measure=Time
Format=%#S

[mDate]
Measure=Time
Format=%d %m %Y

; Ticks elapsed inside the current wall-clock second, 0 to #MorphTPS#-1. This
; is what gives the sweep sub-second resolution: Format=%S only resolves to
; whole seconds, so the position between them has to be counted.
;
; Rainmeter updates measures in file order, so when this one runs mPrevS still
; holds the value from the previous cycle -- that inequality is the edge
; detector, and the counter resets on it. It therefore re-phases to the wall
; clock every second and cannot drift.
[mSubTick]
Measure=Calc
Formula=([mRealS] = mPrevS) ? (mSubTick + 1) : 0
DynamicVariables=1

; Deliberately defined AFTER mSubTick: its whole job is to be one cycle stale.
[mPrevS]
Measure=Calc
Formula=[mRealS]
DynamicVariables=1

; Free-running update counter, used only by debug mode. Counts ticks, not
; seconds, so anything measured in real seconds must scale it by #MorphTPS#.
[mTick]
Measure=Calc
Formula=mTick+1

; Minutes since midnight, from either the real clock or the debug ramp.
[mMinutes]
Measure=Calc
Formula=(#Debug# = 1) ? (#DebugStartMin# + Floor((mTick - #TickZero#) / (#DebugSecPerMin# * #MorphTPS#))) : ([mRealH] * 60 + [mRealM])
DynamicVariables=1

[mHH]
Measure=Calc
Formula=Floor(mMinutes / 60) % 24

[mMM]
Measure=Calc
Formula=mMinutes % 60

; The four rendered digits.
[mH1]
Measure=Calc
Formula=Floor(mHH / 10)

[mH2]
Measure=Calc
Formula=mHH % 10

[mM1]
Measure=Calc
Formula=Floor(mMM / 10)

[mM2]
Measure=Calc
Formula=mMM % 10

; How far a changing digit has swept into its next value, 0-59.
; Frame 0 is the pure current digit and frame 59 the pure next one, so the
; :59 -> :00 handover draws the same image twice and never jumps.
;
; Real clock: held at frame 0 until #MorphSecs# seconds remain, then the full
; 0-59 range is traversed across the #MorphSecs# x #MorphTPS# ticks inside the
; window -- exactly 0 on the first of them and exactly 59 on the last, whatever
; the rate and window length. Position within the minute is counted in ticks,
; [mRealS] x #MorphTPS# + mSubTick, so the steps are sub-second.
;
; Debug clock: the sweep is stretched over the WHOLE simulated minute instead.
; A simulated minute is only #DebugSecPerMin# x #MorphTPS# ticks long, so a
; short window would contain barely any of them and the sweep would never be
; seen -- which defeats the point of a mode that exists to watch it.
[mFrame]
Measure=Calc
Formula=(#Morph# = 0) ? 0 : ((#Debug# = 1) ? Floor((((mTick - #TickZero#) % (#DebugSecPerMin# * #MorphTPS#)) * 59) / ((#DebugSecPerMin# * #MorphTPS#) - 1)) : ((([mRealS] * #MorphTPS#) + mSubTick < ((60 - #MorphSecs#) * #MorphTPS#)) ? 0 : Floor(((([mRealS] * #MorphTPS#) + mSubTick - ((60 - #MorphSecs#) * #MorphTPS#)) * 59) / ((#MorphSecs# * #MorphTPS#) - 1))))
DynamicVariables=1

; The four digits one minute from now -- what each position is sweeping into.
[mNext]
Measure=Calc
Formula=(mMinutes + 1) % 1440

[mNH1]
Measure=Calc
Formula=Floor(mNext / 600)

[mNH2]
Measure=Calc
Formula=Floor(mNext / 60) % 10

[mNM1]
Measure=Calc
Formula=Floor((mNext % 60) / 10)

[mNM2]
Measure=Calc
Formula=mNext % 10

; Per-position frame: mFrame where the digit is about to change, else pinned
; to 0 -- the only frame the <d>_<d> folders hold.
[mFrameH1]
Measure=Calc
Formula=(mH1 = mNH1) ? 0 : mFrame

[mFrameH2]
Measure=Calc
Formula=(mH2 = mNH2) ? 0 : mFrame

[mFrameM1]
Measure=Calc
Formula=(mM1 = mNM1) ? 0 : mFrame

[mFrameM2]
Measure=Calc
Formula=(mM2 = mNM2) ? 0 : mFrame

; Per-position trim: #TrimOne# when that digit is a 1, else 0.
[mTrimH1]
Measure=Calc
Formula=(mH1 = 1) ? #TrimOne# : 0
DynamicVariables=1

[mTrimH2]
Measure=Calc
Formula=(mH2 = 1) ? #TrimOne# : 0
DynamicVariables=1

[mTrimM1]
Measure=Calc
Formula=(mM1 = 1) ? #TrimOne# : 0
DynamicVariables=1

[mTrimM2]
Measure=Calc
Formula=(mM2 = 1) ? #TrimOne# : 0
DynamicVariables=1

; ------------------------------------------------------------------ meters --

; Invisible full-size canvas, drawn first so the window keeps a constant
; footprint regardless of kerning.
[MeterCanvas]
Meter=Image
SolidColor=0,0,0,1
X=0
Y=0
W=(#CanvasW#*#Scale#)
H=(#CanvasH#*#Scale#)
DynamicVariables=1

; Trimming narrows the block by 2*(t1+t2+t3+t4), so centring it means starting
; t1+t2+t3+t4 in from the left -- and the first cell itself starts t1 earlier
; than its own ink, which leaves exactly t2+t3+t4.
; Each digit reads a transition frame rather than a plain digit. Frame 0 of
; any <old>_<new> folder is identical to #ImgDir#\<old>.png.
[MeterH1]
Meter=Image
ImageName=#ImgDir#\morph\#MorphCell#\[mH1]_[mNH1]\[mFrameH1].png
X=(([mTrimH2]+[mTrimM1]+[mTrimM2])*#Scale#)
Y=0
W=(#DigitW#*#Scale#)
H=(#DigitH#*#Scale#)
DynamicVariables=1

[MeterH2]
Meter=Image
ImageName=#ImgDir#\morph\#MorphCell#\[mH2]_[mNH2]\[mFrameH2].png
X=((#Tracking#-[mTrimH1]-[mTrimH2])*#Scale#)R
Y=0
W=(#DigitW#*#Scale#)
H=(#DigitH#*#Scale#)
DynamicVariables=1

[MeterM1]
Meter=Image
ImageName=#ImgDir#\morph\#MorphCell#\[mM1]_[mNM1]\[mFrameM1].png
X=((#Tracking#+#SepWidth#-[mTrimH2]-[mTrimM1])*#Scale#)R
Y=0
W=(#DigitW#*#Scale#)
H=(#DigitH#*#Scale#)
DynamicVariables=1

[MeterM2]
Meter=Image
ImageName=#ImgDir#\morph\#MorphCell#\[mM2]_[mNM2]\[mFrameM2].png
X=((#Tracking#-[mTrimM1]-[mTrimM2])*#Scale#)R
Y=0
W=(#DigitW#*#Scale#)
H=(#DigitH#*#Scale#)
DynamicVariables=1

; Fine print, hung below the canvas. The window grows downward from a fixed
; top-left, so adding this does not move the clock off the wallpaper's centre.
[MeterDate]
Meter=String
MeasureName=mDate
X=((#CanvasW#*#Scale#)/2)
Y=((#CanvasH#+#DateGap#)*#Scale#)
FontFace=Consolas
FontSize=(#DateSize#*#Scale#)
FontColor=#TextColor#
StringAlign=CenterTop
AntiAlias=1
DynamicVariables=1
